[environment]
distribution.name = nextgisweb_ce
distribution.description = NextGIS Web Community Edition
distribution.version = ${CRATER_DISTRIBUTION_VERSION}
distribution.date = ${CRATER_DISTRIBUTION_DATE}

[core]
debug = false
sdir = ${CRATER_ROOT}/data/app
database.host = localhost
database.port = 5432
database.name = nextgisweb
database.user = nextgisweb
database.pwfile = ${CRATER_SECRET_DIR}/postgres
backup.path = ${CRATER_BACKUP_DIR}
backup.filename = nextgisweb-%Y%m%d-%H%M%S.ngwbackup
locale.external_path = ${CRATER_ROOT}/package/nextgisweb_i18n
locale.poeditor.project_id = 435991
locale.contribute_url = https://docs.nextgis.com/docs_ngcom/source/translation.html

[pyramid]
dist_path = ${CRATER_ROOT}/dist
backup.download = true
static_key = 00000000

[qgis]
svg_path = /usr/share/qgis/svg
test.qgis_headless_path = ${CRATER_ROOT}/package/nextgisweb_qgis

